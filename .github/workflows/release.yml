name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: builds the binaries, skips release creation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -buildvcs=false -ldflags "-s -w" -o dist/syscgo ./cmd/syscgo
          go build -buildvcs=false -ldflags "-s -w" -o dist/syscgo-tui ./cmd/syscgo-tui
          go build -buildvcs=false -ldflags "-s -w" -o dist/flf2bit ./cmd/flf2bit

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sysc-Go-binaries
          path: dist/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --latest \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
